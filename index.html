<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/images/miniexchangelogo.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore student exchange opportunities, check eligibility, and review visa guidance with Kuwait University College of Business Administration." />
  <title>KU Exchange | Kuwait University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.143.0/build/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.143.0/examples/jsm/"
      }
    }
  </script>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('team2-theme') || 'dark'
  </script>
</head>

<body>
  <script>
    // The home page's planet needs these before it can draw. Starting them here lets them
    // download while the app bundle loads instead of after it; other routes skip them.
    // Keep the URLs in step with src/components/PlanetScene.jsx. The service worker
    // (public/sw.js) stores whatever is listed here for the next visit.
    // This sits in <body> on purpose: the build moves the import map to the end of <head>,
    // and the module preloads below must not run before it or "three" cannot resolve.
    if (['', '#', '#/'].includes(location.hash)) {
      const three = 'https://unpkg.com/three@0.143.0/'
      const assets = 'https://api.getlayers.ai/storage/v1/object/public/public/assets/ascend-d9857ad1f2/'
      const draco = 'https://www.gstatic.com/draco/versioned/decoders/1.5.5/'
      const hints = [
        ...['build/three.module.js', 'examples/jsm/postprocessing/EffectComposer.js', 'examples/jsm/postprocessing/RenderPass.js',
          'examples/jsm/postprocessing/ShaderPass.js', 'examples/jsm/postprocessing/Pass.js', 'examples/jsm/postprocessing/MaskPass.js',
          'examples/jsm/shaders/CopyShader.js', 'examples/jsm/loaders/GLTFLoader.js', 'examples/jsm/loaders/DRACOLoader.js',
        ].map((path) => ({ rel: 'modulepreload', href: three + path })),
        { rel: 'modulepreload', href: 'https://unpkg.com/lenis@1.3.23/dist/lenis.mjs' },
        { rel: 'preload', as: 'fetch', href: assets + 'planet.glb' },
        { rel: 'preload', as: 'fetch', href: assets + 'planet-lights.glb' },
        { rel: 'preload', as: 'image', href: assets + 'planet-clouds.png' },
        { rel: 'preload', as: 'fetch', href: draco + 'draco_wasm_wrapper.js' },
        { rel: 'preload', as: 'fetch', href: draco + 'draco_decoder.wasm' },
      ]
      hints.forEach(({ rel, as, href }) => {
        const link = document.createElement('link')
        link.rel = rel
        link.href = href
        if (as) link.as = as
        link.crossOrigin = 'anonymous'
        document.head.appendChild(link)
      })
    }
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
